# K8s Console — wartości chartu.
#
# Dwa tryby:
#   mode: console — konsola (Deployment, Service, opcjonalnie Ingress / HTTPRoute) + RBAC na tym klastrze;
#   mode: agent   — agent na klastrze zdalnym: sam łączy się do konsoli (wychodząco, HTTPS) i przekazuje
#                   jej zapytania do lokalnego API, Prometheusa i Hubble. Na tym klastrze nic nie jest
#                   wystawiane. Gotowe polecenie instalacji agenta wypisuje konsola po helm install / upgrade.
mode: console

image:
  repository: docker.io/arturkiwa/k8s-console
  tag: "" # domyślnie appVersion chartu
  digest: "" # sha256:… — przypięcie obrazu (zalecane); ma pierwszeństwo przed tagiem
  pullPolicy: IfNotPresent
imagePullSecrets: [] # [{ name: regcred }] — rejestr lustrzany / prywatny

# ---- tożsamość użytkowników konsoli ----
identity:
  # prefiks nazw użytkowników i grup przy impersonacji (np. "kc:viewer", grupa "kc:poc-viewers") —
  # chroni przed podszyciem się pod istniejące podmioty (system:*). Ten sam na wszystkich klastrach.
  prefix: "kc:"
  # Użytkownicy lokalni (PoC). Hash bcrypt: docker run --rm -i <obraz> hash-password
  users: []
  #  - { username: viewer, passwordHash: "$2a$10$…", groups: [poc-viewers] }
  #  - { username: operator, passwordHash: "$2a$10$…", groups: [poc-operators] }

session:
  ttl: 8h
  secureCookie: null # null = automatycznie: true, gdy Ingress / HTTPRoute z TLS; false dla samego HTTP

# Grupy, pod które konsola może się podszywać (bez prefiksu), i ich uprawnienia (rbac.create).
groups:
  viewers: poc-viewers # odczyt (rola `view` + nody + metryki)
  operators: poc-operators # odczyt + akcje: restart, skalowanie, cordon / drain, usuwanie podów…

# ---- klastry ----
# Klaster, na którym działa konsola (token ServiceAccountu poda).
localCluster:
  enabled: true
  name: local
  allowMutations: false # false = konsola odrzuca operacje zmieniające stan, niezależnie od RBAC
  metrics: {} # opcjonalnie Prometheus / Thanos Query — patrz README
  hubble: {} # opcjonalnie Hubble Relay (Cilium)

# Klastry zdalne z agentem. Dla każdego chart generuje klucz agenta (Secret <release>-agent-keys,
# zachowywany przy upgrade i po uninstall). Polecenie instalacji agenta: helm status / NOTES.
agents: []
#  - name: prod-a
#    allowMutations: false
#    metrics: {} # tylko window, useForInsights, clusterSelector — adres i hasło Prometheusa podaje się agentowi

# Adres konsoli, pod który łączą się agenty (https://…). Puste = z ingress.host / httpRoute.hostnames.
publicURL: ""

# ---- zaufane CA (własne CA organizacji) ----
# Dokładane do systemowej puli CA dla wszystkich połączeń wychodzących: konsola → Prometheus / Thanos,
# Hubble Relay; agent → adres konsoli (certyfikat Ingressu), Prometheus. Wiele certyfikatów PEM można skleić w jeden blok.
trust:
  caBundle: ""
  #  -----BEGIN CERTIFICATE-----
  #  …
  #  -----END CERTIFICATE-----
  existingConfigMap: "" # albo ConfigMap z plikami PEM (wszystkie klucze trafiają do puli)

# Dodatkowe Secrety montowane w /etc/k8s-console/secrets/<nazwa>/ — np. hasło do Prometheusa
# (metrics.basicAuthPasswordFile: /etc/k8s-console/secrets/<nazwa>/<klucz>) albo certyfikaty Hubble.
extraSecretMounts: []

# Zmienne środowiskowe, np. proxy wyjściowe:
#  - { name: HTTPS_PROXY, value: http://proxy.example.internal:3128 }
#  - { name: NO_PROXY, value: .svc,.cluster.local,10.0.0.0/8 }
extraEnv: []

# ---- RBAC ----
rbac:
  create: true # ServiceAccount z prawem impersonacji + role dla grup
  extendedRead: true # odczyt zasobów klastra spoza roli `view` (StorageClass, CRD, webhooki, Istio, Cilium…)
  argocdRead: false # operatorzy: odczyt aplikacji ArgoCD (Historia: kto zarządza i jak synchronizuje)
  rbacRead: false # operatorzy: odczyt ról i powiązań (Bezpieczeństwo: uprawnienia kont, „kto może”) — ujawnia model uprawnień
  collector: true # historia zużycia z metrics-server (tożsamość <prefix>console-collector)

serviceAccount:
  name: "" # domyślnie <release>-impersonator

# ---- historia zużycia (Rekomendacje bez Prometheusa) ----
history:
  enabled: true
# ---- Rekomendacje: historia z Prometheusa / Thanosa liczona raz na dobę w tle (i „Przelicz teraz”) ----
insights:
  dailyAt: "02:00" # HH:MM, strefa czasowa kontenera (zwykle UTC); wynik w /data (persistence)
persistence:
  enabled: true # false = emptyDir (historia ginie z podem)
  size: 1Gi
  storageClass: ""
  existingClaim: ""

# ---- wystawienie ----
service:
  type: ClusterIP # NodePort do szybkich testów bez Ingressu
  port: 80
  nodePort: null
ingress:
  enabled: false
  className: ""
  host: console.example.internal
  annotations: {}
  tls:
    secretName: "" # Secret TLS z certyfikatem od CA organizacji; puste = bez TLS na Ingressie
httpRoute: # Gateway API zamiast Ingressu
  enabled: false
  parentRefs: [] # [{ name: gateway, namespace: gateway-system, sectionName: https }]
  hostnames: []
  tls: true # czy brama kończy TLS (wpływa tylko na secureCookie)

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi } # duży klaster (tysiące podów): 1Gi; konsola sama trzyma się ~85% limitu
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# ---- mode: agent ----
agent:
  server: "" # adres konsoli, np. https://console.example.internal
  cluster: "" # nazwa klastra — taka sama jak w `agents` konsoli
  key: "" # klucz agenta z konsoli (gotowe polecenie wypisuje konsola)
  existingSecret: "" # albo Secret z kluczem pod kluczem `key`
  prometheus:
    url: "" # np. http://prometheus-operated.monitoring.svc:9090 — pusto = bez Prometheusa
    username: ""
    passwordSecret: { name: "", key: password } # Secret z hasłem (w namespace agenta)
  hubble:
    address: "" # np. hubble-relay.kube-system.svc:80 — pusto = bez Hubble
    tls:
      enabled: false # Relay z TLS (Cilium: hubble.relay.tls.server.enabled)
      secretName: "" # Secret w namespace agenta: ca.crt (+ tls.crt, tls.key dla mTLS)
      clientCert: true # mTLS: certyfikat klienta z tls.crt / tls.key
      serverName: "" # nazwa z certyfikatu Relay; Cilium: <cokolwiek>.hubble-relay.cilium.io
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 256Mi }
