{{- if eq .Values.mode "console" }}
{{- if not (or .Values.localCluster.enabled .Values.agents) }}
{{- fail "potrzebny co najmniej jeden klaster: localCluster.enabled albo agents" }}
{{- end }}
{{- if not .Values.identity.users }}
{{- fail "identity.users: dodaj co najmniej jednego użytkownika (hash bcrypt: docker run --rm -i <obraz> hash-password)" }}
{{- end }}
{{- $clusters := list }}
{{- with .Values.localCluster }}
{{- if .enabled }}
{{- $c := dict "name" .name "allowMutations" .allowMutations "credentials" (dict "type" "incluster") }}
{{- $clusters = append $clusters (merge $c (include "kc.clusterExtras" . | fromJson)) }}
{{- end }}
{{- end }}
{{- $seen := dict }}
{{- if .Values.localCluster.enabled }}{{ $_ := set $seen .Values.localCluster.name true }}{{ end }}
{{- range .Values.agents }}
{{- if not .name }}{{ fail "agents: każdy klaster wymaga name" }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .name) }}{{ fail (printf "agents %s: nazwa tylko z małych liter, cyfr i '-'" .name) }}{{ end }}
{{- if hasKey $seen .name }}{{ fail (printf "agents %s: nazwa klastra powtórzona" .name) }}{{ end }}
{{- $_ := set $seen .name true }}
{{- with .metrics }}{{ if or .prometheusURL .basicAuthUsername .bearerTokenFile .caFile }}
{{- fail "agents: adres i hasło Prometheusa podaje się agentowi (agent.prometheus), w konsoli tylko window / useForInsights / clusterSelector" }}
{{- end }}{{ end }}
{{- $c := dict "name" .name "allowMutations" (default false .allowMutations) "credentials" (dict "type" "agent" "agentKeyFile" (printf "/etc/k8s-console/agent-keys/%s" .name)) }}
{{- if .metrics }}{{ $_ := set $c "metrics" .metrics }}{{ end }}
{{- $clusters = append $clusters $c }}
{{- end }}
{{- $users := list }}
{{- range .Values.identity.users }}
{{- if not (and .username .passwordHash) }}{{ fail "identity.users: username i passwordHash są wymagane" }}{{ end }}
{{- if not (hasPrefix "$2" .passwordHash) }}{{ fail (printf "identity.users %s: passwordHash to nie hash bcrypt — wklej wynik hash-password (zaczyna się od $2a$10$)" .username) }}{{ end }}
{{- $users = append $users (dict "username" .username "passwordHash" .passwordHash "groups" (default list .groups)) }}
{{- end }}
{{- $cfg := dict
  "listen" "0.0.0.0:8080"
  "session" (dict "ttl" .Values.session.ttl "secureCookie" (eq (include "kc.tls" .) "true"))
  "identity" (dict "provider" "static" "prefix" (dict "user" .Values.identity.prefix "group" .Values.identity.prefix) "staticUsers" $users)
  "clusters" $clusters
  "history" (dict "disabled" (not .Values.history.enabled) "dataDir" "/data")
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kc.fullname" . }}-config
  labels: {{- include "kc.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
