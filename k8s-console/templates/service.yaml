{{- if eq .Values.mode "console" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kc.fullname" . }}
  labels: {{- include "kc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "kc.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kc.fullname" . }}-data
  labels: {{- include "kc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep # historia zostaje po helm uninstall
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.persistence.size }} }
{{- end }}
{{- end }}
