{{- if and (eq .Values.mode "console") .Values.trust.caBundle (not .Values.trust.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kc.fullname" . }}-ca
  labels: {{- include "kc.labels" . | nindent 4 }}
data:
  ca-bundle.pem: |
    {{- .Values.trust.caBundle | nindent 4 }}
{{- end }}
