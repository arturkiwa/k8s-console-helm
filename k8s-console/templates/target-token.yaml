{{- if eq .Values.mode "target" }}
{{- if not .Values.rbac.create }}{{ fail "mode: target wymaga rbac.create: true" }}{{ end }}
# Długożyjący token ServiceAccountu dla konsoli działającej na innym klastrze (klucze token i ca.crt).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kc.sa" . }}-token
  labels: {{- include "kc.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "kc.sa" . }}
type: kubernetes.io/service-account-token
{{- end }}
